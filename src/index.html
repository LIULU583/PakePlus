<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>自动登录助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','Segoe UI',sans-serif;background:#f0f2f5;color:#333;height:100vh;display:flex;flex-direction:column;font-size:14px}

/* ── 顶栏 ── */
.header{background:linear-gradient(135deg,#1a237e,#283593);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;color:#fff}
.header .logo{font-size:20px}
.header h1{font-size:16px;font-weight:600}
.header .version{font-size:11px;color:#9fa8da;margin-left:auto}
.header .status-badge{padding:3px 10px;border-radius:10px;font-size:11px;background:rgba(255,255,255,.15)}
.header .clock{font-size:12px;color:#c5cae9;font-family:'Consolas',monospace;margin-right:10px}

/* ── 主体 ── */
.main{flex:1;display:flex;overflow:hidden;padding:16px;gap:16px}

/* ── 左：账号面板 ── */
.panel-left{width:360px;min-width:300px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden}
.panel-left .panel-head{background:#f5f7fa;padding:10px 14px;font-size:13px;font-weight:600;color:#1a237e;border-bottom:1px solid #e8ecf1}
.acct-body{flex:1;overflow-y:auto;padding:4px 0}

.acct-item{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid #f0f1f5;cursor:pointer;gap:8px;transition:.1s}
.acct-item:hover{background:#f5f7fa}
.acct-item.active{background:#e8eaf6;border-left:3px solid #3f51b5}
.acct-item .idx{width:18px;color:#9e9e9e;font-size:11px;flex-shrink:0}
.acct-item .uname{flex:1;font-size:13px;color:#333}
.acct-item .pwd{color:#bdbdbd;font-family:monospace;font-size:12px;margin-right:4px}
.acct-item .del{color:#ef5350;cursor:pointer;font-size:14px;opacity:0;transition:.15s;padding:2px 4px;border-radius:4px}
.acct-item:hover .del{opacity:1}
.acct-item .del:hover{background:#ffebee}
.empty-msg{padding:24px;text-align:center;color:#9e9e9e;font-size:13px}

.acct-inputs{display:flex;gap:6px;padding:8px 14px 4px}
.acct-inputs input{flex:1;padding:6px 10px;border:1px solid #e0e0e0;border-radius:6px;font-size:13px;outline:none;background:#fafafa}
.acct-inputs input:focus{border-color:#3f51b5;background:#fff}

.acct-btns{display:flex;gap:6px;padding:4px 14px 10px}
.acct-btns button{flex:1}

/* ── 右：设置面板（类键盘侠风格） ── */
.panel-right{flex:1;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 20px;overflow-y:auto;min-width:340px}
.panel-right .panel-head{font-size:13px;font-weight:600;color:#1a237e;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #e8eaf6}

/* 每一行设置项 */
.set-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid #f5f5f5;min-height:36px}
.set-row:last-child{border-bottom:none}
.set-label{font-size:13px;color:#555;flex:1}
.set-control{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* 开关 */
.toggle{position:relative;width:40px;height:22px;background:#ccc;border-radius:11px;cursor:pointer;transition:.2s;flex-shrink:0}
.toggle.on{background:#3f51b5}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:20px}

/* 输入框/下拉 */
.set-control input[type=number],.set-control select{
  width:56px;padding:4px 6px;border:1px solid #e0e0e0;border-radius:5px;font-size:13px;text-align:center;outline:none;background:#fafafa}
.set-control input[type=number]:focus,.set-control select:focus{border-color:#3f51b5}
.set-control select{width:auto;min-width:56px}
.set-control .hotkey-input{width:56px;text-align:center}
.set-control .unit{font-size:12px;color:#9e9e9e}

/* 速度滑条 */
.speed-slider{display:flex;align-items:center;gap:10px;width:100%;max-width:280px}
.speed-slider input[type=range]{flex:1;accent-color:#3f51b5;height:4px}
.speed-slider .val{color:#1a237e;font-weight:600;min-width:32px;text-align:center;font-size:12px}
.speed-tags{display:flex;justify-content:space-between;font-size:11px;color:#9e9e9e;padding:0 2px;margin-top:-2px;max-width:280px}

/* 分隔符显示 */
.delim-display{padding:4px 10px;background:#f5f7fa;border:1px solid #e8ecf1;border-radius:5px;font-size:14px;color:#1a237e;font-weight:600;font-family:monospace}

/* ── 运行按钮 ── */
.run-area{padding:10px 0 4px;display:flex;gap:10px;align-items:center}
.btn{background:#f5f5f5;border:1px solid #e0e0e0;border-radius:6px;padding:7px 16px;font-size:13px;cursor:pointer;color:#555;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#eee;border-color:#ccc}
.btn:active{transform:scale(.97)}
.btn-primary{background:#3f51b5;border-color:#3f51b5;color:#fff}
.btn-primary:hover{background:#303f9f}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-start{background:#1b5e20;border-color:#1b5e20;color:#fff;padding:8px 24px;font-size:14px;font-weight:600}
.btn-start:hover{background:#2e7d32}
.btn-start:disabled{opacity:.4}

/* ── 日志 ── */
.log-area{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;max-height:140px}
.log-bar{display:flex;justify-content:space-between;align-items:center;padding:5px 14px;background:#f5f7fa;border-bottom:1px solid #e8ecf1;flex-shrink:0}
.log-bar .title{font-size:12px;color:#78909c;display:flex;align-items:center;gap:6px}
.log-bar .clear-btn{font-size:11px;color:#9e9e9e;cursor:pointer;padding:1px 6px;border-radius:4px}
.log-bar .clear-btn:hover{color:#333;background:#eee}
.log-content{flex:1;overflow-y:auto;padding:6px 14px;font-family:'Consolas','Courier New',monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:#666}
.log-content .ok{color:#2e7d32}
.log-content .err{color:#c62828}
.log-content .info{color:#1565c0}
.log-content .warn{color:#e65100}

/* ── 窗口控制（托盘相关提示） ── */
.tray-hint{font-size:11px;color:#9e9e9e;padding:4px 0 2px;text-align:center}
</style>
</head>
<body>

<!-- ═══ 顶栏 ═══ -->
<div class="header">
  <span class="logo">⌨️</span>
  <h1>自动登录助手</h1>
  <span class="clock" id="clock"></span>
  <span class="version">v1.2</span>
  <span class="status-badge" id="statusBadge">⚪ 就绪</span>
</div>

<!-- ═══ 主体 ═══ -->
<div class="main">

  <!-- ── 左：账号 ── -->
  <div class="panel-left">
    <div class="panel-head">📋 账号管理</div>
    <div class="acct-body" id="acctBody"></div>
    <div class="empty-msg" id="emptyMsg">还没有账号，添加或导入吧</div>
    <div class="acct-inputs">
      <input id="newUser" placeholder="账号" spellcheck="false">
      <input id="newPass" placeholder="密码" spellcheck="false" type="password">
    </div>
    <div class="acct-btns">
      <button class="btn btn-primary btn-sm" onclick="addAccount()">➕ 添加</button>
      <button class="btn btn-sm" onclick="document.getElementById('fileInput').click()">📂 导入</button>
      <input type="file" id="fileInput" accept=".txt,.csv" style="display:none" onchange="importFromTxt(event)">
    </div>
  </div>

  <!-- ── 右：设置 ── -->
  <div class="panel-right">
    <div class="panel-head">⚙️ 设置</div>

    <!-- 快捷键 -->
    <div class="set-row">
      <span class="set-label">🎯 输入快捷键</span>
      <div class="set-control">
        <select id="hotkeySelect" class="hotkey-input">
          <option value="f1">F1</option>
          <option value="f2">F2</option>
          <option value="f3">F3</option>
          <option value="f4">F4</option>
          <option value="f5">F5</option>
          <option value="f6" selected>F6</option>
          <option value="f7">F7</option>
          <option value="f8">F8</option>
          <option value="f9">F9</option>
          <option value="f10">F10</option>
          <option value="f11">F11</option>
          <option value="f12">F12</option>
        </select>
        <div class="toggle on" id="hotkeyToggle" onclick="toggleSwitch(this)"></div>
      </div>
    </div>

    <!-- 输入前双击鼠标 -->
    <div class="set-row">
      <span class="set-label">🖱 输入前双击鼠标左键</span>
      <div class="set-control">
        <div class="toggle" id="dblClickToggle" onclick="toggleSwitch(this)"></div>
      </div>
    </div>

    <!-- 输入完按回车 -->
    <div class="set-row">
      <span class="set-label">⏎ 输入完成后敲击回车键</span>
      <div class="set-control">
        <div class="toggle on" id="enterToggle" onclick="toggleSwitch(this)"></div>
      </div>
    </div>

    <!-- 延迟 -->
    <div class="set-row">
      <span class="set-label">⏱ 点击输入后延迟秒数</span>
      <div class="set-control">
        <input type="number" id="delaySec" min="0" max="10" step="0.5" value="2">
        <span class="unit">秒</span>
      </div>
    </div>

    <!-- 分隔符 -->
    <div class="set-row">
      <span class="set-label">🔗 内容分隔符</span>
      <div class="set-control">
        <span class="delim-display">-</span>
        <span class="unit">（减号）</span>
      </div>
    </div>

    <!-- 换行键 -->
    <div class="set-row">
      <span class="set-label">↹ 内容换行键</span>
      <div class="set-control">
        <select id="tabKeySelect">
          <option value="tab" selected>Tab</option>
          <option value="enter">Enter</option>
          <option value="space">Space</option>
          <option value="down">↓</option>
        </select>
      </div>
    </div>

    <!-- TAB次数 -->
    <div class="set-row">
      <span class="set-label">↹ TAB 切换次数</span>
      <div class="set-control">
        <input type="number" id="tabCount" min="1" max="10" value="1">
        <span class="unit">次</span>
      </div>
    </div>

    <!-- 输入速度 -->
    <div class="set-row" style="flex-wrap:wrap;padding-bottom:2px">
      <span class="set-label">⌨️ 输入速度</span>
      <div class="speed-slider">
        <span style="font-size:11px;color:#9e9e9e">较慢</span>
        <input type="range" id="speedRange" min="0.01" max="0.3" step="0.005" value="0.06">
        <span style="font-size:11px;color:#9e9e9e">较快</span>
        <span class="val" id="speedVal">适中</span>
      </div>
    </div>

    <!-- 开机自启 -->
    <div class="set-row">
      <span class="set-label">🖥 开机自动启动</span>
      <div class="set-control">
        <div class="toggle" id="autoStartToggle" onclick="toggleSwitch(this);toggleAutoStart()"></div>
      </div>
    </div>

    <!-- 运行 -->
    <div class="run-area">
      <button class="btn-start" id="startBtn" onclick="startLogin()">▶ 执行输入</button>
      <button class="btn btn-sm" onclick="hideWindow()">🙈 隐藏到托盘</button>
      <span style="font-size:11px;color:#9e9e9e;margin-left:auto">托盘中运行 · 快捷键随时可用</span>
    </div>
  </div>
</div>

<!-- ═══ 日志 ═══ -->
<div class="log-area">
  <div class="log-bar">
    <span class="title">📄 运行日志</span>
    <span class="clear-btn" onclick="clearLogs()">清除</span>
  </div>
  <div class="log-content" id="logContent"></div>
</div>

<!-- ═══ JS ═══ -->
<script>
let accounts = [];
let config = {};
let pollTimer = null;

// ── 开关组件 ──
function toggleSwitch(el) {
  el.classList.toggle('on');
}

// ── 初始化 ──
async function init() {
  await loadAccounts();
  await loadConfig();
  await loadAutoStart();
  startClock();
  startLogPoll();
}

// ── 时钟 ──
function startClock() {
  function update() {
    const d = new Date();
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const s = `${days[d.getDay()]} ${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')} GMT+8`;
    document.getElementById('clock').textContent = s;
  }
  update();
  setInterval(update, 1000);
}

// ── 账号 ──
async function loadAccounts() {
  try {
    const raw = await pywebview.api.get_accounts();
    accounts = JSON.parse(raw);
    renderAccounts();
  } catch(e) { console.error(e); }
}

function renderAccounts() {
  const body = document.getElementById('acctBody');
  const empty = document.getElementById('emptyMsg');
  body.innerHTML = '';
  if (accounts.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  accounts.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'acct-item' + (i === 0 ? ' active' : '');
    div.onclick = () => selectAcct(i);
    div.innerHTML = `
      <span class="idx">${i+1}</span>
      <span class="uname">${escHtml(a.username)}</span>
      <span class="pwd">${'•'.repeat(Math.min(a.password.length,10))}</span>
      <span class="del" onclick="event.stopPropagation();delAcct(${i})">✕</span>
    `;
    body.appendChild(div);
  });
}

function selectAcct(idx) {
  document.querySelectorAll('.acct-item').forEach((el,i) => el.className = 'acct-item' + (i===idx?' active':''));
  try { pywebview.api.set_selected(idx); } catch(e) {}
}

async function addAccount() {
  const u = document.getElementById('newUser').value.trim();
  const p = document.getElementById('newPass').value.trim();
  if (!u || !p) { logLine('请填写账号和密码', 'err'); return; }
  accounts.push({username: u, password: p, remark: ''});
  await pywebview.api.save_accounts(JSON.stringify(accounts));
  document.getElementById('newUser').value = '';
  document.getElementById('newPass').value = '';
  renderAccounts();
  logLine(`已添加：${u}`, 'ok');
}

function importFromTxt(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    const lines = e.target.result.split(/\r?\n/);
    let added = 0;
    for (const line of lines) {
      const t = line.trim();
      if (!t || t.startsWith('#')) continue;
      const parts = t.split('-').map(s => s.trim());
      if (parts.length >= 2) {
        accounts.push({username: parts[0], password: parts[1], remark: parts.slice(2).join('-')||''});
        added++;
      }
    }
    if (added > 0) {
      await pywebview.api.save_accounts(JSON.stringify(accounts));
      renderAccounts();
      logLine(`导入 ${added} 个账号`, 'ok');
    } else logLine('未找到有效账号', 'err');
    event.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

async function delAcct(idx) {
  accounts.splice(idx, 1);
  await pywebview.api.save_accounts(JSON.stringify(accounts));
  renderAccounts();
  logLine('已删除', 'warn');
}

// ── 配置 ──
async function loadConfig() {
  try {
    const raw = await pywebview.api.get_config();
    config = JSON.parse(raw);
    applyConfig();
  } catch(e) { console.error(e); }
}

function applyConfig() {
  document.getElementById('hotkeySelect').value = config.hotkey || 'f6';
  document.getElementById('speedRange').value = config.typing_speed || 0.06;
  updateSpeedLabel();
  document.getElementById('tabCount').value = config.tab_count || 1;
  document.getElementById('delaySec').value = config.start_delay || 2;
  if (config.enter_enabled !== false) document.getElementById('enterToggle').classList.add('on');
  if (config.hotkey_enabled !== false) document.getElementById('hotkeyToggle').classList.add('on');
  if (config.dblclick_enabled) document.getElementById('dblClickToggle').classList.add('on');
}

function updateSpeedLabel() {
  const v = parseFloat(document.getElementById('speedRange').value);
  const labels = {0.01:'极速',0.02:'极速',0.04:'较快',0.06:'适中',0.08:'适中',0.10:'较慢',0.15:'较慢',0.20:'慢速',0.30:'慢速'};
  let label = '适中';
  for (const [k,l] of Object.entries(labels)) {
    if (v >= parseFloat(k)) label = l;
  }
  document.getElementById('speedVal').textContent = label;
}

function collectConfig() {
  return {
    hotkey: document.getElementById('hotkeySelect').value,
    hotkey_enabled: document.getElementById('hotkeyToggle').classList.contains('on'),
    typing_speed: parseFloat(document.getElementById('speedRange').value),
    tab_count: parseInt(document.getElementById('tabCount').value),
    tab_delay: 0.3,
    enter_enabled: document.getElementById('enterToggle').classList.contains('on'),
    dblclick_enabled: document.getElementById('dblClickToggle').classList.contains('on'),
    start_delay: parseFloat(document.getElementById('delaySec').value),
    tab_key: document.getElementById('tabKeySelect').value,
    log_enabled: true,
  };
}

async function saveConfigNow() {
  const cfg = collectConfig();
  await pywebview.api.save_config(JSON.stringify(cfg));
  config = cfg;
}

['hotkeySelect','tabCount','tabKeySelect'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => saveConfigNow());
});
['speedRange','delaySec'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => saveConfigNow());
});

// ── 开机自启 ──
async function loadAutoStart() {
  try {
    const en = await pywebview.api.get_auto_start();
    if (en) document.getElementById('autoStartToggle').classList.add('on');
  } catch(e) {}
}
async function toggleAutoStart() {
  const en = document.getElementById('autoStartToggle').classList.contains('on');
  const ok = await pywebview.api.set_auto_start(en);
  if (ok) logLine(en ? '开机自启已开启' : '开机自启已关闭', 'ok');
  else { document.getElementById('autoStartToggle').classList.toggle('on'); logLine('设置失败', 'err'); }
}

// ── 窗口控制 ──
async function hideWindow() {
  try { await pywebview.api.hide_window(); } catch(e) {}
}

// ── 执行 ──
async function startLogin() {
  await saveConfigNow();
  let idx = 0;
  document.querySelectorAll('.acct-item').forEach((el,i) => { if(el.classList.contains('active')) idx=i; });
  if (idx >= accounts.length) { logLine('请先添加账号', 'err'); return; }
  const btn = document.getElementById('startBtn');
  btn.disabled = true; btn.textContent = '⏳ 执行中...';
  logLine(`▶ 执行：${accounts[idx].username}`, 'info');
  try { await pywebview.api.start_login(idx); } catch(e) { logLine(`失败：${e}`, 'err'); }
}

// ── 日志 ──
function logLine(text, type='') {
  const el = document.getElementById('logContent');
  const line = document.createElement('div');
  line.className = type;
  const d = new Date();
  const ts = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  line.textContent = `[${ts}] ${text}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function clearLogs() { document.getElementById('logContent').innerHTML = ''; }

async function pollLogs() {
  try {
    const logs = await pywebview.api.pull_logs();
    if (logs) logs.split('\n').filter(l=>l).forEach(line => {
      let t='';
      if (line.match(/[✓+]|✅|完成|已/)) t='ok';
      else if (line.match(/[✗]|❌|出错|失败/)) t='err';
      else if (line.match(/[i▶]|开始|触发/)) t='info';
      else if (line.match(/[!]/)) t='warn';
      logLine(line.replace(/\[\d{2}:\d{2}:\d{2}\] /,''), t);
    });
    const st = await pywebview.api.get_status_text();
    document.getElementById('statusBadge').textContent = st;
    const btn = document.getElementById('startBtn');
    if (st.includes('运行中')) { btn.disabled=true; btn.textContent='⏳ 运行中...'; }
    else { btn.disabled=false; btn.textContent='▶ 执行输入'; }
  } catch(e) {}
}

function startLogPoll() { pollTimer = setInterval(pollLogs, 500); }

function escHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
