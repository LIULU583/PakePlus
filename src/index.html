<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>自动登录助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','Segoe UI',sans-serif;background:#f0f2f5;color:#333;height:100vh;display:flex;flex-direction:column;font-size:14px}
.header{background:linear-gradient(135deg,#1a237e,#283593);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;color:#fff}
.header .logo{font-size:20px}
.header h1{font-size:16px;font-weight:600}
.header .version{font-size:11px;color:#9fa8da;margin-left:auto}
.header .status-badge{padding:3px 10px;border-radius:10px;font-size:11px;background:rgba(255,255,255,.15)}
.header .clock{font-size:12px;color:#c5cae9;font-family:'Consolas',monospace;margin-right:10px}
.main{flex:1;display:flex;overflow:hidden;padding:16px;gap:16px}
.panel-left{width:360px;min-width:300px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden}
.panel-left .panel-head{background:#f5f7fa;padding:10px 14px;font-size:13px;font-weight:600;color:#1a237e;border-bottom:1px solid #e8ecf1}
.acct-body{flex:1;overflow-y:auto;padding:4px 0}
.acct-item{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid #f0f1f5;cursor:pointer;gap:8px;transition:.1s}
.acct-item:hover{background:#f5f7fa}
.acct-item.active{background:#e8eaf6;border-left:3px solid #3f51b5}
.acct-item .idx{width:18px;color:#9e9e9e;font-size:11px;flex-shrink:0}
.acct-item .uname{flex:1;font-size:13px;color:#333}
.acct-item .pwd{color:#bdbdbd;font-family:monospace;font-size:12px;margin-right:4px}
.acct-item .del{color:#ef5350;cursor:pointer;font-size:16px;opacity:0;transition:.15s;padding:2px 6px;border-radius:4px}
.acct-item:hover .del{opacity:1}
.acct-item .del:hover{background:#ffebee}
.empty-msg{padding:24px;text-align:center;color:#9e9e9e;font-size:13px}
.acct-inputs{display:flex;gap:6px;padding:8px 14px 4px}
.acct-inputs input{flex:1;padding:6px 10px;border:1px solid #e0e0e0;border-radius:6px;font-size:13px;outline:none;background:#fafafa}
.acct-inputs input:focus{border-color:#3f51b5;background:#fff}
.acct-btns{display:flex;gap:6px;padding:4px 14px 10px}
.acct-btns button{flex:1}
.panel-right{flex:1;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 20px;overflow-y:auto;min-width:340px}
.panel-right .panel-head{font-size:13px;font-weight:600;color:#1a237e;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #e8eaf6}
.set-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid #f5f5f5;min-height:36px}
.set-row:last-child{border-bottom:none}
.set-label{font-size:13px;color:#555;flex:1}
.set-control{display:flex;align-items:center;gap:8px;flex-shrink:0}
.toggle{position:relative;width:40px;height:22px;background:#ccc;border-radius:11px;cursor:pointer;transition:.2s;flex-shrink:0}
.toggle.on{background:#3f51b5}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:20px}
.set-control input[type=number],.set-control select{width:56px;padding:4px 6px;border:1px solid #e0e0e0;border-radius:5px;font-size:13px;text-align:center;outline:none;background:#fafafa}
.set-control input[type=number]:focus,.set-control select:focus{border-color:#3f51b5}
.set-control select{width:auto;min-width:56px}
.set-control .hotkey-input{width:56px;text-align:center}
.set-control .unit{font-size:12px;color:#9e9e9e}
.speed-slider{display:flex;align-items:center;gap:10px;width:100%;max-width:280px}
.speed-slider input[type=range]{flex:1;accent-color:#3f51b5;height:4px}
.speed-slider .val{color:#1a237e;font-weight:600;min-width:32px;text-align:center;font-size:12px}
.delim-display{padding:4px 10px;background:#f5f7fa;border:1px solid #e8ecf1;border-radius:5px;font-size:14px;color:#1a237e;font-weight:600;font-family:monospace}
.run-area{padding:10px 0 4px;display:flex;gap:10px;align-items:center}
.btn{background:#f5f5f5;border:1px solid #e0e0e0;border-radius:6px;padding:7px 16px;font-size:13px;cursor:pointer;color:#555;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#eee;border-color:#ccc}
.btn-primary{background:#3f51b5;border-color:#3f51b5;color:#fff}
.btn-primary:hover{background:#303f9f}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-start{background:#1b5e20;border-color:#1b5e20;color:#fff;padding:8px 24px;font-size:14px;font-weight:600}
.btn-start:hover{background:#2e7d32}
.log-area{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;max-height:140px}
.log-bar{display:flex;justify-content:space-between;align-items:center;padding:5px 14px;background:#f5f7fa;border-bottom:1px solid #e8ecf1;flex-shrink:0}
.log-bar .title{font-size:12px;color:#78909c;display:flex;align-items:center;gap:6px}
.log-bar .clear-btn{font-size:11px;color:#9e9e9e;cursor:pointer;padding:1px 6px;border-radius:4px}
.log-bar .clear-btn:hover{color:#333;background:#eee}
.log-content{flex:1;overflow-y:auto;padding:6px 14px;font-family:'Consolas','Courier New',monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:#666}
.log-content .ok{color:#2e7d32}
.log-content .err{color:#c62828}
.log-content .info{color:#1565c0}
.log-content .warn{color:#e65100}
</style>
</head>
<body>
<div class="header">
  <span class="logo">⌨️</span>
  <h1>自动登录助手</h1>
  <span class="clock" id="clock"></span>
  <span class="version">v1.2</span>
  <span class="status-badge" id="statusBadge">⚪ 就绪</span>
</div>
<div class="main">
  <div class="panel-left">
    <div class="panel-head">📋 账号管理</div>
    <div class="acct-body" id="acctBody"></div>
    <div class="empty-msg" id="emptyMsg">还没有账号，下方添加或导入</div>
    <div class="acct-inputs">
      <input id="newUser" placeholder="账号" spellcheck="false">
      <input id="newPass" placeholder="密码" spellcheck="false" type="password">
    </div>
    <div class="acct-btns">
      <button class="btn btn-primary btn-sm" id="addBtn">➕ 添加</button>
      <button class="btn btn-sm" id="importBtn">📂 导入TXT</button>
      <input type="file" id="fileInput" accept=".txt,.csv" style="display:none">
    </div>
  </div>
  <div class="panel-right">
    <div class="panel-head">⚙️ 设置</div>
    <div class="set-row">
      <span class="set-label">🎯 输入快捷键</span>
      <div class="set-control">
        <select id="hotkeySelect" class="hotkey-input">
          <option value="F3">F3</option><option value="F4">F4</option>
          <option value="F5">F5</option><option value="F6" selected>F6</option>
          <option value="F7">F7</option><option value="F8">F8</option>
          <option value="F9">F9</option><option value="F10">F10</option>
          <option value="F11">F11</option><option value="F12">F12</option>
        </select>
        <div class="toggle on" id="hotkeyToggle"></div>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">🖱 输入前双击鼠标左键</span>
      <div class="set-control"><div class="toggle" id="dblToggle"></div></div>
    </div>
    <div class="set-row">
      <span class="set-label">⏎ 输入完成后敲击回车键</span>
      <div class="set-control"><div class="toggle on" id="entToggle"></div></div>
    </div>
    <div class="set-row">
      <span class="set-label">⏱ 点击输入后延迟秒数</span>
      <div class="set-control">
        <input type="number" id="delaySec" min="0" max="10" step="0.5" value="2">
        <span class="unit">秒</span>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">🔗 内容分隔符</span>
      <div class="set-control">
        <span class="delim-display">-</span>
        <span class="unit">（减号）</span>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">↹ TAB 切换次数</span>
      <div class="set-control">
        <input type="number" id="tabCount" min="1" max="10" value="1">
        <span class="unit">次</span>
      </div>
    </div>
    <div class="set-row" style="flex-wrap:wrap;padding-bottom:2px">
      <span class="set-label">⌨️ 输入速度</span>
      <div class="speed-slider">
        <span style="font-size:11px;color:#9e9e9e">较慢</span>
        <input type="range" id="speedRng" min="0.01" max="0.3" step="0.005" value="0.06">
        <span style="font-size:11px;color:#9e9e9e">较快</span>
        <span class="val" id="speedLbl">适中</span>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">🖥 开机自动启动</span>
      <div class="set-control"><div class="toggle" id="autoToggle"></div></div>
    </div>
    <div class="run-area">
      <button class="btn-start" id="startBtn">▶ 执行输入</button>
      <span style="font-size:11px;color:#9e9e9e;margin-left:auto">内网可用 · 数据本地存储</span>
    </div>
  </div>
</div>
<div class="log-area">
  <div class="log-bar">
    <span class="title">📄 运行日志</span>
    <span class="clear-btn" id="clearBtn">清除</span>
  </div>
  <div class="log-content" id="logBox">[启动中...]</div>
</div>

<script>
(function() {
  "use strict";

  // ── 全局变量 ──────────────────────────────────────────
  var accounts = [];
  var selectedIdx = 0;

  // ── 工具：日志 ────────────────────────────────────────
  function log(text, type) {
    type = type || '';
    var el = document.getElementById('logBox');
    if (!el) return;
    var d = new Date();
    var h = String(d.getHours()).padStart(2,'0');
    var m = String(d.getMinutes()).padStart(2,'0');
    var s = String(d.getSeconds()).padStart(2,'0');
    var div = document.createElement('div');
    if (type) div.className = type;
    div.textContent = '[' + h + ':' + m + ':' + s + '] ' + text;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  }

  // ── 数据存储 ──────────────────────────────────────────
  function saveAll() {
    var data = {
      accounts: accounts,
      config: getConfig()
    };
    try {
      localStorage.setItem('auto_login_data', JSON.stringify(data));
    } catch(e) {
      console.warn('localStorage 写入失败:', e);
      log('⚠ 数据存储失败', 'warn');
    }
  }

  function loadAll() {
    try {
      var raw = localStorage.getItem('auto_login_data');
      if (raw) {
        var d = JSON.parse(raw);
        if (d.accounts) accounts = d.accounts;
        if (d.config) applyConfig(d.config);
      }
    } catch(e) {
      console.warn('localStorage 读取失败:', e);
    }
    renderAccounts();
  }

  // ── 渲染账号列表 ──────────────────────────────────────
  function renderAccounts() {
    var body = document.getElementById('acctBody');
    var empty = document.getElementById('emptyMsg');
    if (!body) return;
    body.innerHTML = '';
    if (accounts.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    for (var i = 0; i < accounts.length; i++) {
      var a = accounts[i];
      var div = document.createElement('div');
      div.className = 'acct-item' + (i === selectedIdx ? ' active' : '');
      div.setAttribute('data-idx', i);
      (function(idx) {
        div.onclick = function() {
          selectedIdx = idx;
          renderAccounts();
        };
      })(i);
      var uname = a.username || '';
      var passLen = Math.min((a.password || '').length, 10);
      var dots = '';
      for (var j = 0; j < passLen; j++) dots += '•';
      div.innerHTML = '<span class="idx">' + (i+1) + '</span>' +
        '<span class="uname">' + escHtml(uname) + '</span>' +
        '<span class="pwd">' + dots + '</span>' +
        '<span class="del" data-idx="' + i + '">✕</span>';
      body.appendChild(div);
    }
    // 删除事件
    body.querySelectorAll('.del').forEach(function(el) {
      el.onclick = function(e) {
        e.stopPropagation();
        var idx = parseInt(this.getAttribute('data-idx'));
        if (isNaN(idx)) return;
        accounts.splice(idx, 1);
        if (selectedIdx >= accounts.length) selectedIdx = Math.max(0, accounts.length - 1);
        saveAll();
        renderAccounts();
        log('已删除', 'warn');
      };
    });
  }

  // ── 添加账号 ──────────────────────────────────────────
  function addAccount() {
    var user = document.getElementById('newUser');
    var pass = document.getElementById('newPass');
    var u = (user.value || '').trim();
    var p = (pass.value || '').trim();
    if (!u || !p) {
      log('请填写账号和密码', 'err');
      return;
    }
    accounts.push({ username: u, password: p, remark: '' });
    user.value = '';
    pass.value = '';
    saveAll();
    renderAccounts();
    log('已添加：' + u, 'ok');
  }

  // ── 导入 TXT ──────────────────────────────────────────
  function importTxt() {
    var input = document.getElementById('fileInput');
    input.value = '';
    input.click();
  }

  function handleFile(ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      var lines = text.split(/\r?\n/);
      var added = 0;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line || line.charAt(0) === '#') continue;
        var parts = line.split('-');
        for (var k = 0; k < parts.length; k++) parts[k] = parts[k].trim();
        if (parts.length >= 2) {
          accounts.push({
            username: parts[0],
            password: parts[1],
            remark: parts.length > 2 ? parts.slice(2).join('-') : ''
          });
          added++;
        }
      }
      if (added > 0) {
        saveAll();
        renderAccounts();
        log('导入 ' + added + ' 个账号', 'ok');
      } else {
        log('未找到有效账号（格式：用户名-密码）', 'err');
      }
    };
    reader.readAsText(file, 'UTF-8');
    ev.target.value = '';
  }

  // ── 配置读写 ──────────────────────────────────────────
  function getConfig() {
    return {
      hotkey: document.getElementById('hotkeySelect').value,
      hotkey_enabled: document.getElementById('hotkeyToggle').classList.contains('on'),
      typing_speed: parseFloat(document.getElementById('speedRng').value),
      tab_count: parseInt(document.getElementById('tabCount').value) || 1,
      enter_enabled: document.getElementById('entToggle').classList.contains('on'),
      dblclick_enabled: document.getElementById('dblToggle').classList.contains('on'),
      start_delay: parseFloat(document.getElementById('delaySec').value) || 2
    };
  }

  function applyConfig(cfg) {
    if (!cfg) return;
    if (cfg.hotkey) document.getElementById('hotkeySelect').value = cfg.hotkey;
    if (cfg.typing_speed) document.getElementById('speedRng').value = cfg.typing_speed;
    if (cfg.tab_count) document.getElementById('tabCount').value = cfg.tab_count;
    if (cfg.start_delay != null) document.getElementById('delaySec').value = cfg.start_delay;
    setToggle('hotkeyToggle', cfg.hotkey_enabled !== false);
    setToggle('entToggle', cfg.enter_enabled !== false);
    setToggle('dblToggle', cfg.dblclick_enabled === true);
    updateSpeedLabel();
  }

  function setToggle(id, on) {
    var el = document.getElementById(id);
    if (!el) return;
    if (on) el.classList.add('on'); else el.classList.remove('on');
  }

  function toggleEl(el) {
    el.classList.toggle('on');
    saveAll();
  }

  function updateSpeedLabel() {
    var v = parseFloat(document.getElementById('speedRng').value);
    var label = '适中';
    if (v <= 0.03) label = '极速';
    else if (v <= 0.05) label = '较快';
    else if (v <= 0.08) label = '适中';
    else if (v <= 0.15) label = '较慢';
    else label = '慢速';
    document.getElementById('speedLbl').textContent = label;
  }

  // ── 执行登录 ──────────────────────────────────────────
  function execLogin() {
    saveAll();
    if (accounts.length === 0) {
      log('请先添加账号', 'err');
      return;
    }
    if (selectedIdx >= accounts.length) selectedIdx = 0;
    var a = accounts[selectedIdx];
    log('▶ 执行：' + (a.username || ''), 'info');
    log('  打包后在此接入键盘模拟 API', 'warn');
  }

  // ── 时钟 ──────────────────────────────────────────────
  function startClock() {
    var el = document.getElementById('clock');
    if (!el) return;
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    function tick() {
      var d = new Date();
      var str = days[d.getDay()] + ' ' +
        d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' +
        String(d.getMinutes()).padStart(2,'0') + ':' +
        String(d.getSeconds()).padStart(2,'0') + ' GMT+8';
      el.textContent = str;
    }
    tick();
    setInterval(tick, 1000);
  }

  // ── HTML 转义 ─────────────────────────────────────────
  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ── 绑定事件 ──────────────────────────────────────────
  function bind(id, event, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener(event, fn);
  }

  // ── 初始化 ────────────────────────────────────────────
  function init() {
    log('自动登录助手启动中...', 'info');

    startClock();
    loadAll();
    log('已加载 ' + accounts.length + ' 个账号', 'info');

    // 按钮事件
    bind('addBtn', 'click', addAccount);
    bind('importBtn', 'click', importTxt);
    bind('fileInput', 'change', handleFile);
    bind('startBtn', 'click', execLogin);
    bind('clearBtn', 'click', function() {
      document.getElementById('logBox').innerHTML = '';
    });

    // 开关事件
    ['hotkeyToggle','dblToggle','entToggle','autoToggle'].forEach(function(id) {
      bind(id, 'click', function() {
        toggleEl(this);
      });
    });

    // 配置自动保存
    bind('hotkeySelect', 'change', saveAll);
    bind('tabCount', 'change', saveAll);
    bind('delaySec', 'change', saveAll);

    // 速度滑条
    bind('speedRng', 'input', function() {
      updateSpeedLabel();
      saveAll();
    });

    // 回车也可以添加
    bind('newPass', 'keydown', function(e) {
      if (e.key === 'Enter') addAccount();
    });

    log('就绪 · 快捷键 F6', 'ok');
  }

  // 页面加载完成后启动
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
